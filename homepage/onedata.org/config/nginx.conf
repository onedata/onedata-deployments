# Based on https://github.com/wmnnd/nginx-certbot
# LICENCE: https://github.com/wmnnd/nginx-certbot/blob/master/LICENSE

server {
    listen 80;
    server_name onedata.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name docs.onedata.org;

    ssl_certificate /etc/letsencrypt/live/onedata.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onedata.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://onedata.org/docs;
}

server {
    listen 443 ssl;
    server_name onedata.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/onedata.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onedata.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /docs/doc/compatibility_reference/compatibility.json { 
        alias /var/www/html/compatibility.json;
    }

    location = /lo {
        root /var/www/html;
        add_header Cache-Control 'no-cache';
        try_files /mail-to-lo.html =404;
    }

    location / {
        root /var/www/html;
        add_header Cache-Control 'no-cache';
    }

    location /book-demo-service/ {
        proxy_pass http://unix:/var/run/sockets/book-demo.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;

        # Strip the /book-demo-service prefix before forwarding
        rewrite ^/book-demo-service/(.*)$ /$1 break;
    }
}
